name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # runtime: full monorepo (PATH_SOURCE = packages), not just an app/.
      # business: PATH_BUSINESS (packages/core) + Stryker config + tests/**.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            runtime:
              - 'packages/**'
              - 'tests/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - '.dependency-cruiser.js'
              - 'vitest.config.*'
              - 'stryker.config.*'
              - 'stryker.conf.*'
              - '.github/workflows/ci.yml'
            business:
              - 'packages/core/**'
              - 'tests/**'
              - 'stryker.config.*'
              - 'stryker.conf.*'
              - 'package-lock.json'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The dependency rule is the central assertion of a hexagonal
      # architecture. Without this step it is a promise; with it, it is a constraint.
      - name: Dependency rule (core does not import infrastructure)
        run: npx depcruise --config .dependency-cruiser.js packages

      - name: Migrations (apply and roll back)
        if: steps.changes.outputs.runtime == 'true'
        run: npm run db:migrate && npm run db:rollback && npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

      - name: Tests
        if: steps.changes.outputs.runtime == 'true'
        run: npx vitest run
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

      # The hard gate is the mutation score, not coverage: requiring a coverage
      # percentage fabricates empty tests. Coverage is published as a signal.
      - name: Mutation testing on critical paths
        if: steps.changes.outputs.business == 'true'
        run: npx stryker run
