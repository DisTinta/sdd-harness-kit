name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # runtime: any path that can change behavior or the suite itself.
      # A short allowlist (only app/ + tests/) would leave out routes/, config/, database/.
      # business: PATH_BUSINESS + Infection config + tests/** (a test change
      # must also re-run mutation over the critical layer).
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            runtime:
              - 'app/**'
              - 'routes/**'
              - 'config/**'
              - 'database/**'
              - 'bootstrap/**'
              - 'resources/**'
              - 'lang/**'
              - 'tests/**'
              - 'composer.json'
              - 'composer.lock'
              - 'phpunit.xml*'
              - 'phpstan.neon*'
              - 'pint.json'
              - 'infection.json'
              - 'artisan'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - '.github/workflows/ci.yml'
            business:
              - 'app/Services/**'
              - 'tests/**'
              - 'infection.json'
              - 'composer.lock'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: xdebug
          extensions: pdo_sqlite, sqlite
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer config --global github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"
          composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test database
        env:
          DB_FILE: ${{ github.workspace }}/database/database.sqlite
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p database
          touch database/database.sqlite
          # Local may use MySQL via .env.testing; in CI we force sqlite in both.
          for f in .env .env.testing; do
            [[ -f "$f" ]] || continue
            if grep -q '^DB_CONNECTION=' "$f"; then
              sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' "$f"
            else
              echo 'DB_CONNECTION=sqlite' >> "$f"
            fi
            if grep -q '^DB_DATABASE=' "$f"; then
              sed -i "s|^DB_DATABASE=.*|DB_DATABASE=${DB_FILE}|" "$f"
            else
              echo "DB_DATABASE=${DB_FILE}" >> "$f"
            fi
          done
          php artisan migrate --force

      - name: Format
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        if: steps.changes.outputs.runtime == 'true'
        run: php artisan test --coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

      # Requires infection.json. With no code in app/Services, it is skipped (gate active once the layer exists).
      # On a PR it only mutates the diff; on push to main, the whole layer. The job does not split: a single required check.
      - name: Mutation testing on critical paths
        if: steps.changes.outputs.business == 'true'
        run: |
          if [ ! -f infection.json ]; then
            echo "Skipping Infection: infection.json not found"
            exit 0
          fi
          if ! find app/Services -name '*.php' -print -quit 2>/dev/null | grep -q .; then
            echo "Skipping Infection: app/Services has no PHP files yet"
            exit 0
          fi
          DIFF_ARGS=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            DIFF_ARGS=(--git-diff-filter=AM --git-diff-base="origin/${{ github.base_ref }}" --git-diff-lines)
          fi
          ./vendor/bin/infection run --configuration=infection.json --test-framework=phpunit --min-msi=70 --no-progress --ignore-msi-with-no-mutations "${DIFF_ARGS[@]}"
        timeout-minutes: 40
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
          XDEBUG_MODE: coverage
