name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # runtime: paths that can change behavior or the suite.
      # business: PATH_BUSINESS (app/services) + Stryker config + tests/**.
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            runtime:
              - 'app/**'
              - 'start/**'
              - 'bin/**'
              - 'config/**'
              - 'database/**'
              - 'tests/**'
              - 'adonisrc.ts'
              - 'ace.js'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'stryker.config.*'
              - 'stryker.conf.*'
              - '.github/workflows/ci.yml'
            business:
              - 'app/services/**'
              - 'tests/**'
              - 'stryker.config.*'
              - 'stryker.conf.*'
              - 'package-lock.json'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        if: steps.changes.outputs.runtime == 'true'
        run: node ace test
        env:
          NODE_ENV: test

      # The hard gate is the mutation score, not coverage: requiring a coverage
      # percentage fabricates empty tests. Coverage is published as a signal.
      - name: Mutation testing on critical paths
        if: steps.changes.outputs.business == 'true'
        run: npx stryker run
