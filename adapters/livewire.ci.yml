name: Frontend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            frontend:
              - 'app/Livewire/**'
              - 'resources/views/**'
              - 'resources/js/**'
              - 'resources/css/**'
              - 'tests/Feature/Livewire/**'
              - 'tests/Livewire/**'
              - 'package.json'
              - 'package-lock.json'
              - 'composer.json'
              - 'composer.lock'
              - 'vite.config.*'
              - 'tests/a11y/**'
              - '.github/workflows/frontend.yml'

      - name: Setup PHP
        if: steps.changes.outputs.frontend == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PHP dependencies
        if: steps.changes.outputs.frontend == 'true'
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer config --global github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"
          composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; else echo "No package.json"; fi

      - name: Build frontend assets
        if: steps.changes.outputs.frontend == 'true'
        run: |
          if [ -f package.json ] && npm run | grep -q ' build'; then npm run build; else echo "No build script"; fi

      - name: Livewire / feature tests (UI)
        if: steps.changes.outputs.frontend == 'true'
        run: |
          if find tests -iname '*Livewire*' 2>/dev/null | grep -q .; then
            php artisan test --filter=Livewire
          else
            echo "No Livewire-named tests yet — skipping UI Pest filter"
          fi
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Accessibility (test:a11y)
        if: steps.changes.outputs.frontend == 'true'
        run: |
          if [ -f package.json ] && npm run | grep -q ' test:a11y'; then
            npm run test:a11y
          else
            echo "WARNING: npm script test:a11y not defined — see docs/frontend-standards.md. Add axe-core or equivalent to enforce this gate."
          fi
